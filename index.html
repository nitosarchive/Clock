<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
    <title>Clock</title>
  </head>
  <body>
    <button id="switch" style="margin-block-end: 1em">Analog</button>
    <div class="digital-container">
      <div class="time__container">
        <h1 id="time"></h1>
      </div>
      <div
        style="
          width: 50px;
          height: 2px;
          background-color: white;
          margin-inline: auto;
          margin-block-end: 1em;
        "
      ></div>
      <div class="footer">
        <div class="wrapper">
          <button id="format-switch">24HR</button>
        </div>
      </div>
    </div>

    <div class="analog-container hidden">
      <div class="bullet"></div>
      <div class="time-faces">
        <span class="twelve">12</span>
        <span class="three">3</span>
        <span class="six">6</span>
        <span class="nine">9</span>

        <div class="one"></div>
        <div class="two"></div>
        <div class="four"></div>
        <div class="five"></div>
        <div class="seven"></div>
        <div class="eight"></div>
        <div class="ten"></div>
        <div class="eleven"></div>
      </div>
      <div class="dial-container">
        <div id="second-hand"></div>

        <div id="minute-hand"></div>

        <div id="hour-hand"></div>
      </div>
    </div>
    <span id="date">Date</span>
  </body>
</html>
